name = "wallet"
main = "server/worker.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "wallet.realmroot.dev"
custom_domain = true

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/.well-known/oauth-protected-resource/*", "/healthz", "/readyz"]

[[d1_databases]]
binding = "DB"
database_name = "agent-wallet-production"
database_id = "1f757b8a-f79d-40cf-be1f-c51cf80424b4"
migrations_dir = "./migrations"

[vars]
# Public application identity.
APP_ORIGIN = "https://wallet.realmroot.dev"
OIDC_ISSUER = "https://id.realmroot.dev/api/auth"
OIDC_CLIENT_ID = "client_87c987abcddf4bb1b283794d626a0f43"
CDP_PROJECT_ID = "16529c0d-6329-4510-83bc-66623d5292da"
CDP_API_KEY_ID = "00130afb-da82-4fd0-9017-e5be16969d50"

# Enabled networks. The UI chooses the first network in the active product mode.
WALLET_NETWORKS = "eip155:8453,eip155:84532,eip155:137,eip155:42161,eip155:480,eip155:4801,solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp,solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"
PAYMENT_NETWORKS = "eip155:84532,eip155:4801,solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"
SIGNER_MODE = "cdp"

# Credential-free RPC endpoints only.
BASE_RPC_URL = "https://mainnet.base.org"
BASE_SEPOLIA_RPC_URL = "https://sepolia.base.org"
POLYGON_RPC_URL = "https://polygon.drpc.org"
ARBITRUM_RPC_URL = "https://arb1.arbitrum.io/rpc"
WORLD_RPC_URL = "https://worldchain-mainnet.g.alchemy.com/public"
WORLD_SEPOLIA_RPC_URL = "https://worldchain-sepolia.g.alchemy.com/public"

# SOLANA_RPC_URL and SOLANA_DEVNET_RPC_URL contain provider credentials and
# are maintained with `wrangler secret put`, not in this file.

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
