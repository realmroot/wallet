<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Agent Wallet</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #080d18; color: #f7f9fc; }
      .transition-screen { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 32px; box-sizing: border-box; color: #aab6c8; background: radial-gradient(circle at 50% 42%, rgba(87, 230, 165, .08), transparent 28%), #080d18; font: 500 14px system-ui, sans-serif; text-align: center; }
      .transition-screen strong { color: #f7f9fc; font-size: 16px; }
      .transition-brand { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 8px; border: 1px solid rgba(179, 202, 230, .21); border-radius: 15px; color: #57e6a5; background: #101a2c; box-shadow: 0 18px 50px rgba(0, 0, 0, .24); font-size: .72rem; font-weight: 800; }
      .transition-spinner { width: 22px; height: 22px; margin: 8px 0 2px; border: 2px solid rgba(179, 202, 230, .21); border-top-color: #57e6a5; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="transition-screen" role="status" aria-label="Loading Agent Wallet">
        <span class="transition-brand">AW</span>
        <strong>Agent Wallet</strong>
        <span class="transition-spinner"></span>
        <span>Loading your wallet…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
